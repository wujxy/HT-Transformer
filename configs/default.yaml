mission_name: "ht_transformer_v3_test"
output_path: "output"
detector_type: "CDWP"

data:
  h5_path: "/data/juno/wujxy/muon_reco/CDWP_HT_muon_rec/HT_train_h5/total_train" # for preprocess
  h5_val_path: null
  geometry_cd: "./PMTPos_CD_LPMT.csv"
  geometry_wp: "./PMTPos_WP_LPMT.csv"
  h5_key_map:
    copyno: "copyno"
    charge: "charge"
    time: "time"
    nhits: "nhits"
    enter_x: "tt_enter_x"
    enter_y: "tt_enter_y"
    enter_z: "tt_enter_z"
    exit_x: "tt_exit_x"
    exit_y: "tt_exit_y"
    exit_z: "tt_exit_z"
    track_time: "track_time"
  max_hits: 20012
  train_ratio: 0.9
  val_ratio: 0.05
  test_ratio: 0.05
  t_max: 800.0
  auto_t_max: false
  max_events: -1       # max events to preprocess (-1 = all events in h5 files)
  preprocess_batch_size: 512
  num_workers: 16
  prefetch_factor: 2

model:
  version: "v3"
  cd_representation: "sparse_pmt_precomputed"

  d_model: 128
  num_heads: 4
  d_ff: 512
  dropout: 0.1

  wp_self_layers: 2
  cd_self_layers: 1
  fusion_layers: 2            # CD↔WP bidirectional cross-attention fusion layers

  num_global_tokens: 8
  num_queries: 2

  # v3 CD sparse token config
  cd_max_tokens: 768          # K_cd
  cd_topk_score: "q_sum"
  cd_feature_dim: 10

  # CD time embedding (v3)
  cd_time_embedding: true
  cd_time_hidden: 32
  cd_time_fourier_dim: 16

  # WP projector (dual-branch, unchanged from v2.1)
  wp_geo_hidden: 32
  wp_qt_hidden: 32
  wp_projector_hidden: 64

  # WP time encoding (SDPA-compatible)
  wp_time_encoding: true
  wp_time_hidden: 32
  wp_time_fourier_dim: 16

  # Position encoding
  abs_posenc: "fourier"
  fourier_freq: 32

  # Normalization
  norm_type: "rmsnorm"

loss:
  lambda_ang: 1.0
  lambda_len: 0.5
  lambda_dir: 0.25

train:
  optimizer: "adamw"
  lr: 2.0e-4
  weight_decay: 1.0e-2
  scheduler: "warmup_plateau"
  warmup_epochs: 5
  plateau_factor: 0.5
  plateau_patience: 5
  plateau_threshold: 1.0e-3
  plateau_min_lr: 1.0e-6
  early_stop_patience: 4
  early_stop_monitor: "val_dir_ang_p68"
  early_stop_mode: "min"
  precision: "bf16"
  dropout: 0.1
  grad_clip: 1.0
  batch_size: 64
  num_epochs: 100
  save_every: 50
  eval_every: 5
  use_accelerate: true
  gradient_accumulation_steps: 2
  seed: 42

augmentation:
  rotation_expand_times: 1
  use_time_jitter: false
  use_drop_hits: false
  use_noise_injection: false
